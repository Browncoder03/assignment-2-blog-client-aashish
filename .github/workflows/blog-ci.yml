name: Blog CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Temporary settings for the GitHub test runner.
    env:
      CI: "true"
      E2E: "true"
      DATABASE_URL: "file:./dev.db"
      PASSWORD: "123"
      JWT_SECRET: "temporary-blog-ci-test-secret"
      PLAYWRIGHT_HTML_OPEN: "never"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database tables
        run: pnpm --filter @repo/db db:push

      - name: Build applications
        run: pnpm exec turbo run build --env-mode=loose --force

      - name: Install Chromium
        working-directory: tests/playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run all E2E tests
        working-directory: tests/playwright
        run: pnpm exec playwright test --reporter=list,html --retries=0 --trace=retain-on-failure

      - name: Save test report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blog-e2e-results
          path: |
            tests/playwright/playwright-report/
            tests/playwright/test-results/
          if-no-files-found: warn
          retention-days: 14
